<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZHEER SAZ VOICE - ژیر ساز ڤۆیس</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      /* Slate 900 */
      color: #f8fafc;
      /* Force Vazirmatn globally if Raber/Nizar are missing */
      font-family: 'Raber', 'Nizar', 'Vazirmatn', 'Noto Naskh Arabic', serif;
    }

    /* Custom scrollbar for text area */
    textarea::-webkit-scrollbar {
      width: 8px;
    }

    textarea::-webkit-scrollbar-track {
      background: #1e293b;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Local font hooks - these will work if the user installs the font files on their PC */
    @font-face {
      font-family: 'Raber';
      src: local('Raber'), local('Raber-Medium'), local('Raber Bold');
    }

    @font-face {
      font-family: 'Nizar';
      src: local('Nizar'), local('Nizar-Regular');
    }
  </style>
